<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="color-scheme" content="light dark" />
  <!-- 자산 버전: bundle-world-manager-css.py 가 내용 해시로 자동 갱신 -->
  <meta name="wm-asset-v" content="86664b69" />
  <title>World Manager</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("worldmanager-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=86664b69" />
</head>
